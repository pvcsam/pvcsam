name: Update profile art

# The portrait and the info card are static -- regenerate those locally when the
# photo or your details change. Only the heatmap needs to stay alive, so this
# job re-scrapes and re-renders just that, then commits it.

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - run: python scripts/fetch_contributions.py
      - run: python scripts/render_heatmap_svg.py

      # [skip ci] keeps the bot's own commit from re-triggering this workflow.
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
